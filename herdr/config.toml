# Herdr Configuration
# ===================
#
# Herdr is an agent-aware terminal multiplexer: a background server owns the
# real terminal processes, clients attach to render them, and panes keep running
# after detach/close. It detects coding agents (claude, opencode, pi, …) in
# panes and rolls their state up per workspace in a sidebar.
#
# Where it sits in this setup (full picture: herdr/keybindings.md):
#   OS windows / spaces .................. Amethyst (Opt+Cmd)
#   Non-persistent terminal splits ....... Ghostty  (Cmd built-ins)
#   Session-persistent, agent-aware panes  Herdr    (this file)
#   Editor (splits, buffers, files) ...... Neovim   (<leader> + Ctrl)
#
# Conventions: gruvbox theme, Vim-style h/j/k/l movement, detach/reattach
# persistence. Prefix stays ctrl+b; [keys] is a deliberate custom remap.
#
# Updates: channel defaults to "stable" with background version/manifest checks;
# run `herdr update` to upgrade, or `herdr channel set <stable|preview>` to switch
# channels. Left at defaults (no [update] block).
#
# Reference:  https://herdr.dev/docs/configuration/  and  /docs/config-reference/
# Full default:  herdr --default-config      Reload running server:  herdr server reload-config
# Validate:      herdr config check

# Skip first-run onboarding; this repo already provisions the setup.
onboarding = false

# gruvbox, matching Alacritty / Lazygit. Auto-switching is off by default,
# keeping the theme dark regardless of the host terminal's appearance.
[theme]
name = "gruvbox"

# gruvbox green accent (same as Lazygit).
[theme.custom]
accent = "#98971a"

# [terminal] is left entirely at Herdr's defaults:
#   shell_mode = "auto" -- already the default; uses login shells on macOS so
#     login-only PATH setup (Homebrew, Mise) runs in new panes. No pin needed.
#   new_cwd = "follow"  -- new panes/tabs/workspaces inherit the source cwd.

[ui]
# Show detected agent labels in split pane borders when no manual name is set.
show_agent_labels_on_pane_borders = true
# Non-default: order the agent panel by state priority instead of by space.
agent_panel_sort = "priority"

# Background notifications: ask Ghostty (a supported terminal) to show a native
# desktop notification when a background agent finishes or needs input. Works
# over SSH; the active tab is suppressed. The default 1s delay filters momentary
# state changes.
[ui.toast]
delivery = "terminal"

# Sound off; rely on the sidebar + terminal notifications. See [ui.sound.agents]
# in `herdr --default-config` for per-agent overrides.
[ui.sound]
enabled = false

# Keep machine/workspace/tab location on the first row; show agent and state
# text on the second. Machine identity disappears for a single local machine.
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", "state_text"],
]

# Keybindings -- deliberate custom remap (Vim-aligned). Prefix stays ctrl+b.
# Most actions also get a prefix-free ctrl+alt chord. Press prefix+? for the
# live list. Herdr is mouse-first: none of these are required.
[keys]

# Session / workspace
workspace_picker = "prefix+shift+w"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+x"
settings = "prefix+shift+s"
# rename_workspace above takes prefix+shift+r, which is reload_config's default.
# Moved here so both actions stay reachable (e = reload). Equivalent to the CLI
# `herdr server reload-config`.
reload_config = "prefix+shift+e"

# Agents (agent-aware navigation; a = agent)
next_agent = ["prefix+a", "ctrl+alt+a"]					# direct chord is a KDE attention-window on Linux; fine on macOS
previous_agent = ["prefix+shift+a", "ctrl+alt+shift+a"]
focus_agent = "prefix+alt+1..9"							# jump to agent 1-9 (prefix-only to avoid tab-index clash)

# Worktrees (grouped workspaces; g = git). Remove is prefix-only (destructive).
new_worktree = ["prefix+shift+g", "ctrl+alt+g"]		# create worktree -> grouped workspace
open_worktree = ["prefix+shift+o", "ctrl+alt+o"]	# open existing worktree checkout
remove_worktree = "prefix+alt+shift+g"				# delete checkout (confirmed; branch kept)

# Tabs (Vim: gt / gT)
new_tab = "prefix+n"
next_tab = ["prefix+t", "ctrl+alt+t"]
previous_tab = ["prefix+shift+t", "ctrl+alt+shift+t"]
switch_tab = ["prefix+1..9", "ctrl+alt+1..9"]
rename_tab = "prefix+r"
close_tab = "prefix+x"

# Panes -- splits (Vim: :split / :vsplit)
split_horizontal = ["prefix+s", "ctrl+alt+s"]	# split downwards
split_vertical = ["prefix+v", "ctrl+alt+v"]		# split to the right

# Panes -- focus (Vim: Ctrl+w h/j/k/l)
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

# Panes -- swap (Vim: Ctrl+w H/J/K/L)
swap_pane_left = ["prefix+shift+h", "ctrl+alt+shift+h"]
swap_pane_down = ["prefix+shift+j", "ctrl+alt+shift+j"]
swap_pane_up = ["prefix+shift+k", "ctrl+alt+shift+k"]
swap_pane_right = ["prefix+shift+l", "ctrl+alt+shift+l"]

# Panes -- misc
close_pane = ["prefix+d", "ctrl+alt+d"]
resize_mode = ["prefix+w", "ctrl+alt+w"]
zoom = ["prefix+z", "ctrl+alt+z"]				# fullscreen the focused pane
edit_scrollback = ["prefix+e", "ctrl+alt+e"]	# open pane scrollback in $EDITOR (nvim)

# Navigate mode -- pane movement defaults to bare h/j/k/l; use Shift+K/J for
# workspace movement while the navigate surface is open (no prefix).
navigate_workspace_up = "shift+k"
navigate_workspace_down = "shift+j"

# Custom commands
# ---------------

# lazygit in a temporary popup (matches the `lg` alias); closes when it exits.
[[keys.command]]
key = "prefix+alt+l"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

# herdr file viewer -> https://github.com/smarzban/herdr-file-viewer
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"
