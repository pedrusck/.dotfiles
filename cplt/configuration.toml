[allow]
exec = [
	"/var/db/xcode_select_link/.." # Xcode MCP (xcode_select_link points to the selected Xcode’s Contents/Developer directory)
]
localhost = [
	3845,	# Figma MCP localhost port
	27124,	# Obsidian MCP localhost port
	64342	# Jetbrains MCP localhost port
]
read = [
	# Neovim minimal mode
	"~/.config/nvim",
	"~/.config/nvim/init.lua",
	"~/.config/nvim/lua",
	"~/.config/nvim/spell",
	# OpenCode custom configuration files
	"~/.config/opencode/cli.json",
	"~/.config/opencode/opencode.json",
	# rumdl formatter configuration
	"~/.config/rumdl/rumdl.toml"
]
socket = [
	"~/.local/state/nvim/mcp.sock",	# Designated Neovim instance
	"~/.local/state/podman/mcp.sock"	# Link to the running Podman machine socket
]

[sandbox]
allow_cache_exec = ["opencode-mcp/npm"] # npx MCP launchers and the Podman native binary (macOS Library/Caches)
