[username]
format = '[$user ]($style)'
style_root = "bold bg:color_orange fg:color_red"
style_user = "bg:color_orange fg:color_terminal_background"

# ===========================================================
# Segment 2: Directory (color_yellow)
# ===========================================================

[directory]
format = "[  $path ]($style)"
read_only = " 󰌾"
style = "bg:color_yellow fg:color_terminal_background"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Developer" = "󰲋 "
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "

# ===========================================================
# Segment 3: Git (color_aqua)
# ===========================================================

[git_branch]
format = '[ $symbol $branch ]($style)'
style = "bg:color_aqua fg:color_terminal_background"
symbol = ""

[git_commit]
tag_symbol = '  '

[git_state]
format = '[($state $progress_current/$progress_total )]($style)'
style = "bg:color_aqua fg:color_terminal_background"

[git_status]
format = '[($all_status$ahead_behind )]($style)'
ignore_submodules = true
style = "bg:color_aqua fg:color_terminal_background"

# ===========================================================
# Segment 4: Languages & Packages (color_blue)
# ===========================================================

[c]
format = '[ $symbol( $version)]($style)'
style = "bg:color_blue fg:color_terminal_background"
symbol = " "

[cpp]
disabled = false
format = '[ $symbol( $version)]($style)'
style = "bg:color_blue fg:color_terminal_background"
symbol = " "

[golang]
format = '[ $symbol( $version)]($style)'
style = "bg:color_blue fg:color_terminal_background"
symbol = " "

[gradle]
format = '[ $symbol( $version)]($style)'
style = "bg:color_blue fg:color_terminal_background"
symbol = ""

[haskell]
format = '[ $symbol( $version)]($style)'
style = "bg:color_blue fg:color_terminal_background"
symbol = " "

[java]
