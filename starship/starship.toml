# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'gruvbox_dark'
command_timeout = 500 # cap per-module command time (ms) so a slow git status etc. can't stall the prompt

format = """
[](fg:color_orange)\
$os\
[](bg:color_terminal_background fg:color_orange)[](bg:color_yellow fg:color_terminal_background)\
$directory\
[](bg:color_aqua fg:color_yellow)\
$git_branch\
$git_status\
$git_state\
[](bg:color_blue fg:color_aqua)\
$c\
$cobol\
$cpp\
$crystal\
$daml\
$dart\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haskell\
$haxe\
$java\
$julia\
$kotlin\
$lua\
$mojo\
$nim\
$ocaml\
$odin\
$perl\
$php\
$purescript\
$python\
$raku\
$red\
$rlang\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$typst\
$vlang\
$zig\
[](bg:color_light_gray fg:color_blue)\
$aws\
$azure\
$conda\
$direnv\
$docker_context\
$gcloud\
$kubernetes\
$mise\
$pixi\
$terraform\
[](bg:color_dark_gray fg:color_light_gray)\
$time\
[ ](fg:color_dark_gray)\
$line_break\
$character"""

## Languages?
## $nodejs\
## $nix_shell\
## $package\

right_format = """
$jobs\
[](fg:color_dark_gray)\
[$status](bg:color_dark_gray)\
[](bg:color_dark_gray fg:color_light_gray)\
$cmd_duration\
[](bg:color_light_gray fg:color_purple)\
$battery\
[](bg:color_purple fg:color_dark_gray)\
$memory_usage\
[](fg:color_dark_gray)\
"""

[palettes.gruvbox_dark]
color_aqua = '#89b482'
color_blue = '#7daea3'
color_cream = '#d4be98'
color_dark_gray = '#32302f'
color_green = '#a9b665'
color_light_gray = '#665c54'
color_orange = '#e78a4e'
color_purple = '#d3869b'
color_red = '#ea6962'
color_terminal_background = '#1d2021'
color_yellow = '#d8a657'

# ===========================================================
# Segment 1: OS & Identity (color_orange)
# ===========================================================

[hostname]
format = '[$ssh_symbol$hostname ]($style)'
ssh_only = true
ssh_symbol = " "
style = "bg:color_orange fg:color_terminal_background"

[os]
disabled = false
format = '[$symbol ]($style)'
style = "bg:color_orange fg:color_terminal_background"

[os.symbols]
Alpaquita = ""
Alpine = ""
AlmaLinux = ""
Amazon = ""
Android = ""
Arch = ""
Artix = ""
CachyOS = ""
CentOS = ""
Debian = ""
DragonFly = ""
Emscripten = ""
EndeavourOS = ""
Fedora = ""
FreeBSD = ""
Garuda = "󰛓"
Gentoo = ""
HardenedBSD = "󰞌"
Illumos = "󰈸"
Kali = ""
Linux = ""
Mabox = ""
Macos = ""
Manjaro = ""
Mariner = ""
MidnightBSD = ""
Mint = ""
NetBSD = ""
NixOS = ""
Nobara = ""
OpenBSD = "󰈺"
openSUSE = ""
OracleLinux = "󰌷"
Pop = ""
