style = "bg:color_blue fg:color_terminal_background"
symbol = " "

[kotlin]
format = '[ $symbol( $version)]($style)'
style = "bg:color_blue fg:color_terminal_background"
symbol = " "

[nix_shell]
disabled = false
format = '[ $symbol( $state)( \($name\))]($style)'
style = "bg:color_blue fg:color_terminal_background"
symbol = " "

[nodejs]
format = '[ $symbol( $version)]($style)'
style = "bg:color_blue fg:color_terminal_background"
symbol = "󰎙 "

[package]
disabled = false
format = '[ $symbol$version]($style)'
style = "bg:color_blue fg:color_terminal_background"
symbol = "󰏗 "

[php]
format = '[ $symbol( $version)]($style)'
style = "bg:color_blue fg:color_terminal_background"
symbol = " "

[python]
format = '[ $symbol( $version)( \($virtualenv\)) ]($style)'
style = "bg:color_blue fg:color_terminal_background"
symbol = " "

[ruby]
disabled = false
format = '[ $symbol( $version)]($style)'
style = "bg:color_blue fg:color_terminal_background"
symbol = " "

[rust]
format = '[ $symbol( $version)]($style)'
style = "bg:color_blue fg:color_terminal_background"
symbol = "󱘗 "

[swift]
format = '[ $symbol( $version)]($style)'
style = "bg:color_blue fg:color_terminal_background"
symbol = " "

# ===========================================================
# Segment 5: Infrastructure & Cloud (color_light_gray)
# ===========================================================

[aws]
format = '[ $symbol($profile)( \($region\)) ]($style)'
style = "bg:color_light_gray fg:color_terminal_background"
symbol = "  "

[azure]
disabled = false
format = '[ $symbol($subscription)]($style)'
style = "bg:color_light_gray fg:color_terminal_background"
symbol = " "

[conda]
format = '[ $symbol( $environment) ]($style)'
style = "bg:color_light_gray fg:color_terminal_background"
symbol = " "

[direnv]
disabled = false
format = '[ $symbol$allowed ]($style)'
style = "bg:color_light_gray fg:color_terminal_background"
symbol = " "

[docker_context]
format = '[ $symbol( $context)]($style)'
style = "bg:color_light_gray fg:color_terminal_background"
symbol = " "

[gcloud]
format = '[ $symbol($project)( \($region\)) ]($style)'
style = "bg:color_light_gray fg:color_terminal_background"
symbol = "  "

[kubernetes]
disabled = false
detect_env_vars = ['KUBECONFIG']
detect_files = ['Dockerfile', 'docker-compose.yml']
detect_folders = ['.kube']
format = '[ $symbol$context( \($namespace\)) ]($style)'
style = "bg:color_light_gray fg:color_terminal_background"
symbol = "󱃾 "

[pixi]
symbol = "󰏗 "

[terraform]
disabled = false
format = '[ $symbol$workspace ]($style)'
style = "bg:color_light_gray fg:color_terminal_background"
symbol = "󱁢 "

# ===========================================================
# Segment 6: Time (color_dark_gray)
# ===========================================================

[time]
disabled = true
format = '[  $time ]($style)'
time_format = "%R" # Hour:Minute Format
style = "bg:color_dark_gray fg:color_cream"

# ===========================================================
# Segment 7: Prompt Character
# ===========================================================

[character]
error_symbol = '[❯](bold fg:color_red)'
success_symbol = '[❯](bold fg:color_green)'
vimcmd_symbol = '[❮](bold fg:color_green)'
vimcmd_replace_symbol = '[❮](bold fg:color_purple)'
vimcmd_visual_symbol = '[❮](bold fg:color_yellow)'

[line_break]
disabled = true

# ===========================================================
# Right Prompt Segments
# ===========================================================

# --- Jobs (floating, before right segments) ---

[jobs]
disabled = false
format = '[$symbol$number ]($style)'
number_threshold = 1
style = "bold fg:color_blue"
symbol = "✦"

# --- Status (color_dark_gray) ---

[status]
disabled = false
format = '[$symbol$common_meaning$signal_name$maybe_int]($style) '
map_symbol = true
style = 'bg:color_dark_gray'
success_symbol = '[[✓](bold bg:color_dark_gray fg:color_green)]($style)'
symbol = '[[✖](bold bg:color_dark_gray fg:color_red)]($style)'

# --- Command Duration (color_light_gray) ---

[cmd_duration]
format = "[ $duration ]($style)"
min_time = 500
style = "bg:color_light_gray fg:color_terminal_background"

# --- Battery (color_purple) ---

[battery]
charging_symbol = "󰂄"
discharging_symbol = "󰂃"
empty_symbol = "󰂎"
format = '[[$symbol]($style) $percentage](bold bg:color_purple fg:color_terminal_background)'
full_symbol = "󰁹"
unknown_symbol = "󰂑"

[[battery.display]]
style = "bold bg:color_purple fg:color_red"
threshold = 30

[[battery.display]]
style = "bg:color_purple fg:color_yellow"
threshold = 60

# --- Memory Usage (color_dark_gray) ---

[memory_usage]
disabled = false
format = '[ $symbol$ram_pct ]($style)'
style = "bg:color_dark_gray fg:color_cream"
symbol = "󰍛 "
threshold = 75

