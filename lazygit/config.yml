customCommands:
  - key: "<c-a>"
    context: "commits"
    description: "Set committer date to author date"
    prompts:
      - type: "confirm"
        key: "Confirm"
        title: "Set committer date to author date"
        body: "Are you sure you want to update the committer date?"
    command: "git rebase --autostash --keep-empty --no-autosquash --rebase-merges --committer-date-is-author-date {{.SelectedCommit.Hash}}^"
  - key: '<c-g>'
    command: "serie"
    context: 'global'
    description: 'Show commit graph'
    output: terminal
  - key: 'x'
    context: 'global'
    description: 'Opens current project in Xcode (dialog if multiple)'
    loadingText: 'Opening Xcode on current project'
    output: popup
    prompts:
      # Only prompt when there is more than one project/workspace. With a
      # single match the prompt is skipped and the command opens it directly.
      - type: 'menuFromCommand'
        title: 'Select a project or workspace to open in Xcode:'
        key: 'XcodeProject'
        # `condition` is evaluated as a Go template, so shell logic must be wrapped
        # in `runCommand`. runCommand tokenizes with str.ToArgv (no shell) and
        # errors on backslashes, hence `sh -c` plus two `find` calls instead of
        # `find \( ... \)`. Resolves to "true" only when there is more than one
        # project/workspace, so a single match skips the prompt (auto-open).
        condition: '{{ runCommand "sh -c \"c=$({ find . -name ''*.xcodeproj'' -not -path ''*.xcodeproj/*''; find . -name ''*.xcworkspace'' -not -path ''*.xcodeproj/*''; } | grep -v ''.build/'' | grep -v DerivedData | grep -c .); [ $c -gt 1 ] && echo true\"" }}'
        command: "find . \\( -name '*.xcodeproj' -o -name '*.xcworkspace' \\) -not -path '*.xcodeproj/*' | grep -v '\\.build/' | grep -v 'DerivedData' | awk -F/ '{print NF, $0}' | sort -n | cut -d' ' -f2-"
        filter: './(?P<project>.*)'
        valueFormat: '{{ .project }}'
        labelFormat: '{{ .project | green }}'
    command: >-
      SELECTED="{{.Form.XcodeProject}}";
      if [ -z "$SELECTED" ]; then
        SELECTED=$(find . \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) -not -path '*.xcodeproj/*' | grep -v '\.build/' | grep -v 'DerivedData' | awk -F/ '{print NF, $0}' | sort -n | cut -d' ' -f2- | sed 's#^\./##');
      fi;
      if [ -z "$SELECTED" ]; then
        echo "No Xcode project or workspace found";
      else
        xed --background "$SELECTED" && echo "Opened $SELECTED in Xcode";
      fi
  - key: 'X'
    context: 'global'
    description: 'Quits Xcode (closes all open projects)'
    loadingText: 'Quitting Xcode'
    output: popup
    command: >-
      osascript -e '
        if application id "com.apple.dt.Xcode" is running then
          tell application id "com.apple.dt.Xcode" to quit saving yes
        end if' &&
      echo "Xcode has been quit"
  - key: '<c-x>'
    context: 'global'
    description: 'Cleans DerivedData for current project (dialog if multiple)'
    loadingText: 'Cleaning DerivedData'
    output: popup
    prompts:
      - type: 'menuFromCommand'
        title: "Select a project or workspace whose DerivedData to clean:"
        key: 'XcodeProject'
        # See the `x` command above for why this condition is wrapped in runCommand.
        condition: '{{ runCommand "sh -c \"c=$({ find . -name ''*.xcodeproj'' -not -path ''*.xcodeproj/*''; find . -name ''*.xcworkspace'' -not -path ''*.xcodeproj/*''; } | grep -v ''.build/'' | grep -v DerivedData | grep -c .); [ $c -gt 1 ] && echo true\"" }}'
        command: "find . \\( -name '*.xcodeproj' -o -name '*.xcworkspace' \\) -not -path '*.xcodeproj/*' | grep -v '\\.build/' | grep -v 'DerivedData' | awk -F/ '{print NF, $0}' | sort -n | cut -d' ' -f2-"
        filter: './(?P<project>.*)'
        valueFormat: '{{ .project }}'
        labelFormat: '{{ .project | green }}'
    command: >-
      SELECTED="{{.Form.XcodeProject}}";
      if [ -z "$SELECTED" ]; then
        SELECTED=$(find . \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) -not -path '*.xcodeproj/*' | grep -v '\.build/' | grep -v 'DerivedData' | awk -F/ '{print NF, $0}' | sort -n | cut -d' ' -f2- | sed 's#^\./##');
      fi;
      if [ -z "$SELECTED" ]; then
        echo "No Xcode project or workspace found";
      else
        PROJ_NAME=$(basename "$SELECTED" | sed -E 's/\.(xcodeproj|xcworkspace)$//');
        find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 1 -type d -name "${PROJ_NAME}-*" -exec rm -rf {} + &&
        echo "Cleaned DerivedData for $PROJ_NAME";
      fi
  - key: '<c-d>'
    context: 'commits'
    description: 'Change commit date and time'
    prompts:
      - type: 'input'
        title: 'Give a new date and time for the commit (default current timestamp):'
        key: 'CommitTimestamp'
        initialValue: ''
        suggestions:
          command: 'Enter a timestamp using the ISO 8601 format'
    # TODO: Check if a timestamp is being entered otherwise use current timestamp with ISO 8601 format -> `date -Iseconds` but using Go
    command: >-
      GIT_COMMITTER_DATE="{{.Form.CommitTimestamp}}" git commit --amend --no-edit --date "{{.Form.CommitTimestamp}}"
    loadingText: 'Changing commit timestamp'
    output: popup
git:
  autoFetch: true
  autoRefresh: true
  disableForcePushing: false
  fetchAll: true # Pass --all flag when running git fetch. Set to false to fetch only origin (or the current branch's upstream remote if there is one)
  mainBranches: [master, main]
  pagers:
    # Inherit the single delta config from ~/.config/git/configuration ([delta]
    # block: dark, syntax-theme=gruvbox-dark, line-numbers, navigate,
    # decorations, tabs=4) so the gruvbox diff theme has one source of truth and
    # can't drift between lazygit and git. --paging=never stays because lazygit
    # manages paging itself.
    - colorArg: always
      pager: delta --paging=never
      useConfig: true
  # The main branches. We colour commits green if they belong to one of these branches,
  # so that you can easily see which commits are unique to your branch (coloured in yellow)
  parseEmoji: true
  overrideGpg: true
gui:
  authorColors:
    # use green for me
    'Pere Bohigas': 'green'
    # use white for other authors
    '*': 'white'
  language: 'en' # one of 'auto' | 'en' | 'zh-CN' | 'zh-TW' | 'pl' | 'nl' | 'ja' | 'ko' | 'ru'
  nerdFontsVersion: "3"
  theme:
    selectedLineBgColor:
      - reverse
      - bold
  timeFormat: '02 Jan 2006' # https://pkg.go.dev/time#Time.Format
notARepository: 'quit'
os:
  editPreset: 'nvim'
