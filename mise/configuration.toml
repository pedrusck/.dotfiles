rtk = "latest" # CLI proxy to minimize LLM token consumption

### macOS utilities
"github:kerma/defaultbrowser" = { version = "latest", asset_pattern = "defaultbrowser", bin = "defaultbrowser", os = ["macos"] } # Command-line tool for getting & setting the default browser (requires Rosetta on Apple Silicon)
# "github:asmvik/yabai" = { version = "latest", os = ["macos"] } # Tiling window manager
# No official Zsh completion was found. Manual setup from the repository root:
# sh yabai/setup.sh
# Select Yabai instead of Amethyst: quit/disable Amethyst and replace its profile
# entry in profiles/development.sh with yabai before starting the service.
# Grant Yabai Accessibility permission in macOS System Settings, then:
# yabai --start-service
# Optional scripting-addition setup is documented in comments in yabai/yabairc.
"github:zsa/zapp" = "latest" # Flash ZSA keyboards from your terminal

### Markdown
glow = "latest" # Render markdown on the CLI
"github:RivoLink/leaf" = { version = "latest", bin = "leaf" } # Terminal Markdown previewer with a GUI-like experience
# "github:mfontanini/presenterm" = "latest" # Terminal slideshow tool
# No official Zsh completion was found; no basic setup. Optional rendering/export
# features need additional dependencies; see upstream documentation before use.
rumdl = "latest" # Markdown Linter and Formatter written in Rust

### Music
spotify-player = "latest" # Command driven spotify player

### Networking
"github:Julien-cpsn/ATAC" = "latest" # A simple API client (postman like) in your terminal
curlie = "latest" # Power of curl, ease of use of httpie
hurl = "latest" # Run and Test HTTP Requests with plain text and curl
xh = "latest" # Friendly and fast tool for sending HTTP requests

### Programming languages
# GHCup's Aqua download contains only the executable. Stage the matching
# upstream completion for the bundled-file recipe in completions-registry.toml.
# ghcup = { version = "latest", postinstall = '''
# completion_dir="$MISE_TOOL_INSTALL_PATH/share/zsh/site-functions"
# mkdir -p "$completion_dir" &&
# curl -fsSL "https://raw.githubusercontent.com/haskell/ghcup-hs/v${MISE_TOOL_VERSION#v}/scripts/shell-completions/zsh" -o "$completion_dir/_ghcup.tmp" &&
# mv "$completion_dir/_ghcup.tmp" "$completion_dir/_ghcup"
# ''' } # Haskell toolchain manager
# Enable the GHCup toolchain path in zsh/zshrc. Install/select tools manually:
# ghcup install ghc recommended --set
# ghcup install cabal recommended --set
# ghcup install hls recommended --set
# ghcup install stack recommended --set
# Upgrade GHCup itself through mise; these toolchains are managed by GHCup.
go = "latest" # Open source programming language to build simple/reliable/efficient software
java = "latest" # Development kit for the Java programming language
node = "latest" # Platform built on V8 to build network applications
# Pkl's Zsh completion registers via bashcompinit and must be sourced rather
# than autoloaded as _pkl. Enable the matching source block in zsh/zshrc.
# pkl = { version = "latest", postinstall = '''
# completion_dir="$MISE_TOOL_INSTALL_PATH/share/zsh"
# mkdir -p "$completion_dir" &&
# pkl shell-completion zsh > "$completion_dir/pkl.zsh.tmp" &&
# mv "$completion_dir/pkl.zsh.tmp" "$completion_dir/pkl.zsh"
# ''' } # Configuration language CLI; no other setup required
python = "latest" # Interpreted, interactive, object-oriented programming language
ruby = "latest" # Powerful, clean, object-oriented scripting language
rust = "latest" # Safe, concurrent, practical language
uv = "latest" # Extremely fast Python package installer and resolver, written in Rust

### Shell and terminal
bottom = "latest" # Yet another cross-platform graphical process/system monitor
cheat = "latest" # Create and view interactive cheat sheets for *nix commands
herdr = "latest" # Agent multiplexer that lives in your terminal
hyperfine = "latest" # Command-line benchmarking tool
"github:alltuner/mise-completions-sync" = "latest" # Sync shell completions for mise-managed tools
# oh-my-posh = "latest" # Cross-shell prompt theme engine; completion command disabled upstream
# Enable oh_my_posh in profiles/development.sh to link its configuration, then
# select its initialization block instead of Starship's in zsh/zshrc.
starship = "latest" # Cross-shell prompt for astronauts
# zellij = "latest" # Terminal multiplexer
# Completion generation is built into sync's registry. Enable zellij in
# profiles/development.sh for config/layout links; optional auto-start is in zsh/zshrc.
zoxide = "latest" # Shell extension to navigate your filesystem faster

### Version control
delta = "latest" # Syntax-highlighting pager for git and diff output
# gh = "latest" # GitHub CLI; gh completion -s zsh is built into sync's registry
# Optional first-use authentication:
# gh auth login
git-lfs = "latest" # Git extension for versioning large files
gitleaks = "latest" # Audit git repos for secrets
gitui = "latest" # Blazing fast terminal-ui for git written in rust
# Hub requires Git (Xcode command-line tools suffice) and Rosetta on Apple Silicon.
# Stage its version-matched completion for the recipe in completions-registry.toml.
# hub = { version = "latest", postinstall = '''
# completion_dir="$MISE_TOOL_INSTALL_PATH/share/zsh/site-functions"
# mkdir -p "$completion_dir" &&
# curl -fsSL "https://raw.githubusercontent.com/mislav/hub/v${MISE_TOOL_VERSION#v}/etc/hub.zsh_completion" -o "$completion_dir/_hub.tmp" &&
# mv "$completion_dir/_hub.tmp" "$completion_dir/_hub"
# ''' } # GitHub support for Git; authenticates on first API use (or uses GITHUB_TOKEN)
lazygit = "latest" # Simple terminal UI for git commands
"github:jnsahaj/lumen" = "latest" # AI-powered CLI tool for git commit summaries
"github:lusingander/serie" = "latest" # Rich git commit graph in your terminal
"github:agavra/tuicr" = "latest" # Terminal UI for Code Reviews - review AI-generated diffs like a GitHub PR

### YAML
yamlfmt = "latest" # Extensible command-line tool to format YAML files
yq = "latest" # Process YAML, JSON, XML, CSV and properties documents from the CLI

[hooks]
postinstall = "if command -v misecompsync >/dev/null 2>&1; then misecompsync --shell zsh --new-only; fi" # Sync completions after tool installations
